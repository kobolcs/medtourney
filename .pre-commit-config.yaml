# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-python-dateutil
        files: ^(TournamentProcessor\.py|run_scraper\.py)$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # TypeScript/JavaScript linting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.57.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.57.1
          - '@typescript-eslint/eslint-plugin@8.70.1'
          - '@typescript-eslint/parser@8.70.1'
          - typescript@5.9.3

  # File and function length limits - CLAUDE.md "File size guidelines"
  - repo: local
    hooks:
      - id: file-lengths
        name: file length limits
        entry: python3 scripts/check_file_lengths.py
        language: system
        pass_filenames: false
        files: \.(py|ts|robot|md)$
      - id: robocop
        name: robocop (Robot length rules)
        entry: robocop check
        language: system
        pass_filenames: false
        files: \.robot$
