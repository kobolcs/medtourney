# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-python-dateutil
        files: ^(TournamentProcessor\.py|run_scraper\.py|geocode_tournaments\.py|tournament_processing/.*\.py|geocoding/.*\.py)$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$  # JSONC (comments allowed)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # TypeScript linting - the repo's own ESLint (npm ci first), so hook and
  # CI can't drift apart the way a pinned mirrors-eslint did
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: ^src/.*\.ts$

  # File and function length limits - CLAUDE.md "File size guidelines"
  - repo: local
    hooks:
      - id: file-lengths
        name: file length limits
        entry: python3 scripts/check_file_lengths.py
        language: system
        pass_filenames: false
        files: \.(py|ts|robot|md)$
      - id: robocop
        name: robocop (Robot length rules)
        entry: robocop check
        language: system
        pass_filenames: false
        files: \.robot$
