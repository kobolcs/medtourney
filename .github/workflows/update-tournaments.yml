name: Update Tournament Data Daily

on:
  schedule:
    # Run daily at 00:00 UTC (midnight)
    - cron: '0 0 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      allow_drop:
        description: 'Publish even if the count dropped >30% vs the last run (a known, genuine drop)'
        type: boolean
        default: false

# One data update at a time: a manual run overlapping the (often delayed)
# scheduled one made the second push fail ("rejected ... fetch first").
# Queue instead - the later run starts from the earlier run's commit.
concurrency:
  group: update-tournaments
  cancel-in-progress: false

jobs:
  scrape-tournaments:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allow workflow to commit and push
      issues: write    # Open / close the "data update failed" alert issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main  # Ensure we're on main branch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and dependencies
        run: |
          rfbrowser init
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Run tournament scraper
        run: |
          python3 run_scraper.py
        continue-on-error: false  # Fail workflow if scraper fails

      # Sanity checks before the new data can replace the published copy:
      # minimum count, no >30% drop vs the last run, time-control and link
      # columns still filled. Thresholds live in scripts/validate_scrape.py.
      - name: Validate scraped data
        env:
          ALLOW_DATA_DROP: ${{ inputs.allow_drop && '1' || '0' }}
        run: |
          git show HEAD:tournaments_data.json > /tmp/previous_tournaments.json 2>/dev/null || true
          python3 scripts/validate_scrape.py tournaments_data.json /tmp/previous_tournaments.json

      # Map coordinates. Runs on every scrape: locations already in the
      # committed geocode_cache.json are reused, only new places are looked up
      # (OpenStreetMap Nominatim, 1 req/s, capped per run - the rest follow on
      # the next run), with a GeoNames offline fallback for town names buried
      # in venue text. Never allowed to fail the data update.
      #
      # The GeoNames file is kept in the Actions cache and refreshed weekly:
      # if a download fails, the previous copy is used, so the fallback (and
      # the ~250 pins that depend on it) never silently drops out for a day.
      - name: Week key for the GeoNames cache
        id: geonames-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore GeoNames towns (geocoding fallback)
        id: geonames-cache
        uses: actions/cache@v6
        with:
          path: /tmp/geonames
          key: geonames-cities1000-${{ steps.geonames-week.outputs.week }}
          restore-keys: geonames-cities1000-

      - name: Download GeoNames towns (weekly refresh)
        if: steps.geonames-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/geonames
          curl -sSfL -o /tmp/geonames/cities1000.zip https://download.geonames.org/export/dump/cities1000.zip
          unzip -o -q /tmp/geonames/cities1000.zip -d /tmp/geonames

      - name: Geocode new tournament locations
        continue-on-error: true
        run: |
          python3 geocode_tournaments.py --geonames /tmp/geonames/cities1000.txt --max-lookups 300 2>&1 | tee /tmp/geocode.log

      - name: Check if tournaments_data.json was updated
        id: check_changes
        run: |
          # Use git status --porcelain so this also detects the file when it is
          # currently untracked (e.g. after being removed from the repo).
          git add -N tournaments_data.json tournaments_data_meta.json geocode_cache.json 2>/dev/null || true
          if [ -z "$(git status --porcelain tournaments_data.json geocode_cache.json)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to tournaments_data.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "tournaments_data.json was updated"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tournaments_data.json
          [ -f tournaments_data_meta.json ] && git add tournaments_data_meta.json || true
          [ -f geocode_cache.json ] && git add geocode_cache.json || true
          git commit -m "Update tournament data - $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      # The site keeps serving the last good data when a run fails, so
      # visitors see nothing - this is how the owner finds out. One open
      # issue per outage (later failures add a comment), closed automatically
      # by the next successful run. Issues reach the repo owner by email and
      # GitHub mobile push under the default notification settings.
      - name: Alert - open or update the "data update failed" issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-update-failed --color B60205 --description "Nightly tournament update failed" 2>/dev/null || true
          EXISTING=$(gh issue list --label data-update-failed --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          else
            BODY=$(printf 'The nightly scrape failed, so the site is still serving the previous data.\n\nRun: %s\n\nThis issue closes itself after the next successful run.' "$RUN_URL")
            gh issue create --label data-update-failed \
              --title "Tournament data update failed ($(date -u +%Y-%m-%d))" \
              --body "$BODY"
          fi

      - name: Close the alert issue after a successful run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label data-update-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: $RUN_URL"
          done

      - name: Upload Robot Framework logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: robot-logs
          path: robot_results/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          if [ -f tournaments_data.json ]; then
            TOURNAMENT_COUNT=$(python3 -c "import json; print(len(json.load(open('tournaments_data.json'))))")
            echo "✅ Successfully processed $TOURNAMENT_COUNT tournaments" >> $GITHUB_STEP_SUMMARY
            echo "📅 Date range: Today to 6 months ahead (dynamic)" >> $GITHUB_STEP_SUMMARY
            echo "🌍 Filtered: European tournaments only (Russia excluded)" >> $GITHUB_STEP_SUMMARY
            [ -f /tmp/geocode.log ] && echo "🗺️ $(tail -1 /tmp/geocode.log)" >> $GITHUB_STEP_SUMMARY || true
          else
            echo "❌ Failed to generate tournaments_data.json" >> $GITHUB_STEP_SUMMARY
          fi
