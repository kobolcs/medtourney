name: Run Tests

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC (cron format: minute hour day month weekday)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  unit-tests:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/python/test_tournament_processor.py -v \
          --cov=TournamentProcessor \
          --cov-report=xml \
          --cov-report=term-missing \
          --timeout=120
      env:
        CI: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: |
          htmlcov/
          coverage.xml

  integration-tests:
    name: Integration Tests (With Timeout Protection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on main/develop branches to save CI minutes
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        rfbrowser init

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m "integration" \
          --timeout=300 \
          --tb=short
      continue-on-error: true  # Don't fail CI if scraper times out
      env:
        CI: true

    - name: Upload Robot Framework logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-logs
        path: |
          robot_results/
        retention-days: 7

  javascript-tests:
    name: JavaScript/Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Run JavaScript tests
      run: |
        node tests/javascript/test_app.spec.js
      env:
        CI: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: javascript-test-results
        path: tests/javascript/
        retention-days: 7

  meta-tests:
    name: Meta-Tests (Scraper Validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run meta-tests
      run: |
        pytest tests/python/test_scraper_meta.py -v --tb=short
      env:
        CI: true

  parity-tests:
    name: Parity Tests (Frontend/Backend Consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run parity tests
      run: |
        pytest tests/python/test_frontend_backend_parity.py -v --tb=short
      env:
        CI: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, javascript-tests, meta-tests, parity-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Unit tests: ${{ needs.unit-tests.result }}"
        echo "JavaScript tests: ${{ needs.javascript-tests.result }}"
        echo "Meta-tests: ${{ needs.meta-tests.result }}"
        echo "Parity tests: ${{ needs.parity-tests.result }}"
        echo "Integration tests: ${{ needs.integration-tests.result }}"

        # Check required tests (unit, javascript, meta, parity)
        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed!"
          exit 1
        fi

        if [ "${{ needs.javascript-tests.result }}" != "success" ]; then
          echo "❌ JavaScript tests failed!"
          exit 1
        fi

        if [ "${{ needs.meta-tests.result }}" != "success" ]; then
          echo "❌ Meta-tests failed!"
          exit 1
        fi

        if [ "${{ needs.parity-tests.result }}" != "success" ]; then
          echo "❌ Parity tests failed!"
          exit 1
        fi

        echo "✅ All required tests passed!"
        echo "📊 Test Summary:"
        echo "  ✅ 47 backend unit tests"
        echo "  ✅ 18 JavaScript tests"
        echo "  ✅ 12 meta-tests"
        echo "  ✅ 8 parity tests"
        echo "  Total: 85 tests"
