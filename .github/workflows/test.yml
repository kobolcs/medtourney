name: Run Tests

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC (cron format: minute hour day month weekday)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  type-check:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run mypy type checking
      run: |
        mypy TournamentProcessor.py run_scraper.py --config-file mypy.ini
      env:
        CI: true

  lint:
    name: Python Linting (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run ruff linting
      run: |
        ruff check .
      env:
        CI: true

  typescript-build:
    name: TypeScript Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: TypeScript type check
      run: npm run type-check

    - name: Build TypeScript
      run: npm run build

    - name: Upload compiled JavaScript
      uses: actions/upload-artifact@v4
      with:
        name: compiled-js
        path: dist/
        retention-days: 7

  unit-tests:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [type-check, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/python/test_tournament_processor.py -v \
          --cov=TournamentProcessor \
          --cov-report=xml \
          --cov-report=term-missing \
          --timeout=120
      env:
        CI: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: |
          htmlcov/
          coverage.xml

  integration-tests:
    name: Integration Tests (With Timeout Protection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on main/develop branches to save CI minutes
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        rfbrowser init

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m "integration" \
          --timeout=300 \
          --tb=short
      continue-on-error: true  # Don't fail CI if scraper times out
      env:
        CI: true

    - name: Upload Robot Framework logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-logs
        path: |
          robot_results/
        retention-days: 7

  javascript-tests:
    name: JavaScript/Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typescript-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Build TypeScript
      run: npm run build

    - name: Run JavaScript tests
      run: |
        node tests/javascript/test_app.spec.js
      env:
        CI: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: javascript-test-results
        path: tests/javascript/
        retention-days: 7

  meta-tests:
    name: Meta-Tests (Scraper Validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run meta-tests
      run: |
        pytest tests/python/test_scraper_meta.py -v --tb=short
      env:
        CI: true

  parity-tests:
    name: Parity Tests (Frontend/Backend Consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run parity tests
      run: |
        pytest tests/python/test_frontend_backend_parity.py -v --tb=short
      env:
        CI: true

  v3-tests:
    name: V3 Feature Tests (Filter Persistence, Calendar, Scraper)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typescript-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Node dependencies
      run: npm ci || npm install

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build TypeScript
      run: npm run build

    - name: Run Phase 2 Feature Tests (JavaScript)
      run: |
        node tests/javascript/test_phase2_features.spec.js
      env:
        CI: true

    - name: Run Calendar Export Tests (JavaScript)
      run: |
        node tests/unit/test_calendar_export.spec.js
      env:
        CI: true

    - name: Run Scraper Optimization Tests (Python)
      run: |
        pytest tests/integration/test_scraper_optimization.py -v --tb=short
      env:
        CI: true

    - name: Upload v3 test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v3-test-results
        path: |
          tests/javascript/
          tests/unit/
          tests/integration/
        retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [type-check, lint, typescript-build, unit-tests, javascript-tests, meta-tests, parity-tests, v3-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Type check: ${{ needs.type-check.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "TypeScript build: ${{ needs.typescript-build.result }}"
        echo "Unit tests: ${{ needs.unit-tests.result }}"
        echo "JavaScript tests: ${{ needs.javascript-tests.result }}"
        echo "Meta-tests: ${{ needs.meta-tests.result }}"
        echo "Parity tests: ${{ needs.parity-tests.result }}"
        echo "V3 tests: ${{ needs.v3-tests.result }}"
        echo "Integration tests: ${{ needs.integration-tests.result }}"

        # Check required tests (type-check, lint, ts-build, unit, javascript, meta, parity, v3)
        if [ "${{ needs.type-check.result }}" != "success" ]; then
          echo "❌ Type checking failed!"
          exit 1
        fi

        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "❌ Linting failed!"
          exit 1
        fi

        if [ "${{ needs.typescript-build.result }}" != "success" ]; then
          echo "❌ TypeScript build failed!"
          exit 1
        fi

        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed!"
          exit 1
        fi

        if [ "${{ needs.javascript-tests.result }}" != "success" ]; then
          echo "❌ JavaScript tests failed!"
          exit 1
        fi

        if [ "${{ needs.meta-tests.result }}" != "success" ]; then
          echo "❌ Meta-tests failed!"
          exit 1
        fi

        if [ "${{ needs.parity-tests.result }}" != "success" ]; then
          echo "❌ Parity tests failed!"
          exit 1
        fi

        if [ "${{ needs.v3-tests.result }}" != "success" ]; then
          echo "❌ V3 tests failed!"
          exit 1
        fi

        echo "✅ All required tests passed!"
        echo "📊 Test Summary:"
        echo "  ✅ Type checking (mypy)"
        echo "  ✅ Linting (ruff)"
        echo "  ✅ TypeScript build"
        echo "  ✅ 47 backend unit tests (v2.0)"
        echo "  ✅ 18 JavaScript tests (v2.0)"
        echo "  ✅ 12 meta-tests"
        echo "  ✅ 8 parity tests"
        echo "  ✅ 41 v3 tests (filter persistence, calendar, scraper)"
        echo "  Total: 126 tests + type safety"
