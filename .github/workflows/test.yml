name: Run Tests

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  unit-tests:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/python/ -v -m "not integration and not slow" \
          --cov=TournamentProcessor \
          --cov-report=xml \
          --cov-report=term-missing \
          --timeout=120
      env:
        CI: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: |
          htmlcov/
          coverage.xml

  integration-tests:
    name: Integration Tests (With Timeout Protection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on main/develop branches to save CI minutes
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        rfbrowser init

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m "integration" \
          --timeout=300 \
          --tb=short
      continue-on-error: true  # Don't fail CI if scraper times out
      env:
        CI: true

    - name: Upload Robot Framework logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-logs
        path: |
          robot_results/
        retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Unit tests: ${{ needs.unit-tests.result }}"
        echo "Integration tests: ${{ needs.integration-tests.result }}"

        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed!"
          exit 1
        fi

        echo "✅ All required tests passed!"
