name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build TypeScript
        run: npm run build:prod

      - name: Verify build output
        run: |
          if [ ! -f "app.js" ]; then
            echo "❌ Build failed: app.js not found"
            exit 1
          fi
          echo "✅ Build successful: app.js created"
          ls -lh app.js

      - name: Create deployment directory
        run: |
          mkdir -p _site
          # Copy all necessary files for deployment
          cp index.html _site/
          cp app.js _site/
          cp styles.css _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          # Copy data files
          [ -f tournaments_data.json ] && cp tournaments_data.json _site/ || echo "No tournament data"
          [ -f config.json ] && cp config.json _site/ || echo "No config file"
          # Copy any images/assets if they exist
          [ -d "assets" ] && cp -r assets _site/ || echo "No assets directory"
          # Create .nojekyll to prevent Jekyll processing
          touch _site/.nojekyll
          echo "✅ Deployment directory created"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed files:**" >> $GITHUB_STEP_SUMMARY
          echo "- index.html" >> $GITHUB_STEP_SUMMARY
          echo "- app.js (compiled TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- styles.css" >> $GITHUB_STEP_SUMMARY
          echo "- robots.txt" >> $GITHUB_STEP_SUMMARY
          echo "- sitemap.xml" >> $GITHUB_STEP_SUMMARY
          echo "- tournaments_data.json (if present)" >> $GITHUB_STEP_SUMMARY
          echo "- config.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # Health check job
  health-check:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Wait for deployment to be ready
        run: sleep 30  # Wait for pages to be fully deployed

      - name: Health check
        run: |
          URL="https://kobolcs.github.io/medtourney/"
          echo "Checking deployment at: $URL"

          # Check if site is accessible
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Site returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Check for key files
          curl -s "$URL" | grep -q "European Chess Tournament Finder"
          if [ $? -eq 0 ]; then
            echo "✅ Main content found"
          else
            echo "❌ Main content not found"
            exit 1
          fi

          echo "✅ Deployment health check passed!"

      - name: Health Check Summary
        if: always()
        run: |
          echo "## 🏥 Deployment Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** https://kobolcs.github.io/medtourney/" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Healthy" >> $GITHUB_STEP_SUMMARY
          echo "**Checked at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
