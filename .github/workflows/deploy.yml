name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger
  # The daily data commit is pushed with GITHUB_TOKEN, which starts no push
  # workflows - redeploy once that workflow finishes so the new data goes live.
  # (Pages must be set to "GitHub Actions" as its source: "Deploy from a
  # branch" publishes the raw repo, whose index.html doesn't run without Vite.)
  workflow_run:
    workflows: [ "Update Tournament Data Daily" ]
    types: [ completed ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build Application
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with Vite (Production Optimized)
        run: npm run build:vite

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful: Vite dist created"
          ls -lh dist/
          du -sh dist/

      - name: Create deployment directory
        run: |
          mkdir -p _site
          # Copy Vite build output (optimized, minified, compressed)
          cp -r dist/* _site/
          # Copy additional files not handled by Vite
          cp robots.txt _site/
          cp sitemap.xml _site/
          # Copy data files
          [ -f tournaments_data.json ] && cp tournaments_data.json _site/ || echo "No tournament data"
          [ -f tournaments_data_meta.json ] && cp tournaments_data_meta.json _site/ || echo "No tournament metadata"
          [ -f config.json ] && cp config.json _site/ || echo "No config file"
          # Create .nojekyll to prevent Jekyll processing
          touch _site/.nojekyll
          echo "✅ Deployment directory created"
          ls -la _site/
          echo "📦 Bundle sizes:"
          du -h _site/*.js 2>/dev/null || echo "JS files compressed"
          du -h _site/*.css 2>/dev/null || echo "CSS files compressed"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build System:** Vite (Production Optimized)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Optimizations Applied:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Minification (Terser)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tree-shaking" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code splitting" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Gzip compression" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Brotli compression" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Compiled for Safari 12 / Chrome 64+" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed files:**" >> $GITHUB_STEP_SUMMARY
          echo "- index.html" >> $GITHUB_STEP_SUMMARY
          echo "- Optimized JavaScript bundles (minified, compressed)" >> $GITHUB_STEP_SUMMARY
          echo "- Optimized CSS (code-split)" >> $GITHUB_STEP_SUMMARY
          echo "- robots.txt" >> $GITHUB_STEP_SUMMARY
          echo "- sitemap.xml" >> $GITHUB_STEP_SUMMARY
          echo "- tournaments_data.json" >> $GITHUB_STEP_SUMMARY
          echo "- config.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # Health check job
  health-check:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Wait for deployment to be ready
        run: sleep 30  # Wait for pages to be fully deployed

      - name: Health check
        run: |
          URL="https://kobolcs.github.io/medtourney/"
          echo "Checking deployment at: $URL"

          # Check if site is accessible
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Site returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Check for key files
          curl -s "$URL" | grep -q "European Chess Tournament Finder"
          if [ $? -eq 0 ]; then
            echo "✅ Main content found"
          else
            echo "❌ Main content not found"
            exit 1
          fi

          echo "✅ Deployment health check passed!"

      - name: Health Check Summary
        if: always()
        run: |
          echo "## 🏥 Deployment Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** https://kobolcs.github.io/medtourney/" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Healthy" >> $GITHUB_STEP_SUMMARY
          echo "**Checked at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
