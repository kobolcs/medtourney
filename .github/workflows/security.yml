name: Security Scanning

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  python-security:
    name: Python Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Run pip-audit (dependency vulnerability scan)
      run: |
        pip-audit --requirement requirements.txt --requirement requirements-dev.txt --format json --output audit-python.json || true

    - name: Display results
      if: always()
      run: |
        if [ -f audit-python.json ]; then
          cat audit-python.json
        fi

    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: python-security-scan
        path: audit-python.json
        retention-days: 30

  npm-security:
    name: NPM Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run npm audit
      run: |
        npm audit --json > audit-npm.json || true

    - name: Display results
      if: always()
      run: |
        if [ -f audit-npm.json ]; then
          cat audit-npm.json
        fi

    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: npm-security-scan
        path: audit-npm.json
        retention-days: 30

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      # The scan always runs; the SARIF upload only succeeds once "Code scanning"
      # is enabled in the repo settings (Settings -> Code security -> Code
      # scanning). Until then the upload reports a configuration error — don't
      # let that turn the check red, since it's a repo-setting concern, not a
      # code defect. Once code scanning is enabled, uploads (and alerts) work
      # with no further change.
      continue-on-error: true
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
