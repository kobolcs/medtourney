# Ruff configuration for Python linting
# https://docs.astral.sh/ruff/configuration/

# Target Python 3.8+
target-version = "py38"

# Line length matching Black
line-length = 100

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "TRY003",  # Avoid specifying long messages outside exception class
    "PTH123",  # Use pathlib.Path.open() instead of builtin open()
    "T201",    # Print statements (needed for logging)
    "DTZ005",  # datetime.now() without timezone
    "DTZ007",  # datetime.strptime() without timezone
    "DTZ001",  # datetime() without tzinfo
    "TRY300",  # Consider moving statement to else block
    "TRY203",  # Remove exception handler that immediately re-raises
    "TRY004",  # Prefer TypeError for invalid type
    "TRY301",  # Abstract raise to inner function
    "SIM102",  # Use single if statement (style preference)
    "PLR2004", # Magic values (acceptable in context)
    "PLR0911", # Too many return statements
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude generated and vendor code
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "dist",
    "build",
    "node_modules",
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "PLR2004", # Allow magic values in tests
    "SLF001",  # Allow private member access in tests
    "B017",    # Allow broad exception assertions in tests
    "PT011",   # Allow broad pytest.raises() in tests
    "ARG002",  # Allow unused arguments in tests (fixtures)
    "PLC0415", # Allow local imports in tests (performance testing)
    "PT018",   # Allow combined assertions in tests
    "PLW2901", # Allow loop variable reassignment in tests
    "N802",    # Allow non-lowercase function names (test context)
]

[lint.isort]
known-first-party = ["TournamentProcessor", "run_scraper"]

[format]
# Use double quotes for strings
quote-style = "single"

# Indent with 4 spaces
indent-style = "space"

# Use \n line endings
line-ending = "lf"
