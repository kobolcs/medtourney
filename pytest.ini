[pytest]
# Pytest configuration for medtourney test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10
    # --cov=.
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-report=xml
    # --cov-config=.coveragerc

# Custom markers for test organization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external resources)
    slow: Slow tests (may take minutes to complete)
    timeout_test: Tests that validate timeout handling
    performance: Performance tests
    requires_browser: Tests that require Browser library installation
    requires_network: Tests that require network access
    ci_skip: Tests to skip in CI/CD environments

# Timeout for tests (prevent hanging in CI/CD)
timeout = 300
timeout_method = thread

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    .venv/*
    venv/*
    */site-packages/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
